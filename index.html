<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <title>2026 Lunar New Year Zodiac Sign</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, #ffecd2 0, #ffe0e0 30%, transparent 60%),
        radial-gradient(circle at bottom right, #ffd6a5 0, #ffb3b3 40%, #b30000 100%);
      background-color: #b30000;
    }

    .card {
      background: #ffffff;
      padding: 24px 28px;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.18);
      max-width: 440px;
      width: 100%;
      position: relative;
      overflow: hidden;
      border: 2px solid #f97316;
    }

    /* little decorative border corners */
    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      border: 3px solid #facc15;
      border-radius: 18px;
      opacity: 0.35;
    }
    .card::before {
      top: -20px;
      left: -20px;
      border-right: none;
      border-bottom: none;
    }
    .card::after {
      bottom: -20px;
      right: -20px;
      border-left: none;
      border-top: none;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .card-header-text {
      flex: 1;
    }

    h1 {
      font-size: 1.45rem;
      margin: 0 0 0.25rem;
      color: #7c2d12;
    }

    p.subtitle {
      margin: 0;
      color: #4b5563;
      font-size: 0.9rem;
    }

    .year-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #b91c1c;
      color: #fef3c7;
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.6rem;
    }

    .horse-emoji {
      font-size: 1rem;
    }

    .horse-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #facc15;
      background: #fffbeb;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }

    form {
      margin-top: 0.75rem;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #374151;
    }

    input[type="date"] {
      width: 100%;
      padding: 0.5rem 0.6rem;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
